log_format audit_json escape=json
  '{"ts":"$time_iso8601","actor":"$auth_user","actor_role":"$auth_role",'
  '"ip":"$remote_addr","event":"kong.api.request","target":null,'
  '"details":{"method":"$request_method","path":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time}}';

server {
    listen 80;
    server_name _;

    # Strip stale Basic auth cached by browsers
    proxy_set_header Authorization "";

    # ─── /kong basePath support (IT Portal System Forward) ───────────────
    # When accessed via IT Portal as /kong/* with preserve_prefix=1, strip
    # the /kong prefix so the existing /auth/, /users/, /logs/, /api/, /
    # locations below still match unchanged. Kong Manager itself receives
    # /kong/ from auth-proxy and serves correctly because KONG_ADMIN_GUI_PATH=/kong.
    rewrite ^/kong/(.*)$ /$1 last;
    rewrite ^/kong$    /     last;

    # ─── Auth subrequest ─────────────────────────────────────────────────
    location = /_auth_check {
        internal;
        proxy_pass http://kong-usermgmt:5000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Auth endpoints (login/logout — public) ──────────────────────────
    location /auth/ {
        proxy_pass http://kong-usermgmt:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Kong Manager GUI (main page — session-protected) ────────────────
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        # Inject XHR rewrite script + logout bar + SEHC branding overlay
        sub_filter '</head>' '
        <style>
          /* Hide the Kong logo and inject "SEHC AI GATEWAY" text in its place */
          .app-navbar-logo > *, .mobile-logo > * { display: none !important; }
          .app-navbar-logo::before, .mobile-logo::before {
            content: "SEHC AI GATEWAY";
            color: #00d09c;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1.2px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            white-space: nowrap;
          }
        </style>
        <script>
        (function(){
          var hardcoded="http://192.168.1.121:8002";
          var real=window.location.protocol+"//"+window.location.host;
          // When accessed via IT Portal at /kong/* (no :8002 port), the
          // pathname starts with /kong. Detect this and inject the /kong
          // prefix into rewritten URLs so /api/foo does not escape to
          // IT Portal own /api/ namespace.
          var prefix = window.location.pathname.indexOf("/kong/")===0 || window.location.pathname==="/kong" ? "/kong" : "";
          if(hardcoded===real && !prefix) return;
          function rewrite(url){
            if(typeof url!=="string") return url;
            if(url.indexOf(hardcoded)===0){
              url = url.replace(hardcoded, real + prefix);
            }
            return url;
          }
          var origOpen=XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open=function(method,url){
            url = rewrite(url);
            return origOpen.apply(this,arguments.length>=3?[method,url,arguments[2],arguments[3],arguments[4]]:[method,url]);
          };
          var origFetch=window.fetch;
          window.fetch=function(input, init){
            if(typeof input==="string") input = rewrite(input);
            else if(input && input.url) input = new Request(rewrite(input.url), input);
            return origFetch.call(this, input, init);
          };
        })();
        window.addEventListener("DOMContentLoaded",function(){
          document.title = "SEHC AI Gateway";
          var bar=document.createElement("div");
          bar.id="kong-logout-bar";
          bar.style.cssText="position:fixed;top:0;right:0;z-index:99999;padding:8px 16px;background:rgba(0,52,89,0.95);border-radius:0 0 0 10px;display:flex;align-items:center;gap:12px;font-family:-apple-system,sans-serif;font-size:13px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,0.2);";
          bar.innerHTML="<span style=color:rgba(255,255,255,0.7)>SEHC AI Gateway</span><a href=/users/ style=color:#64748b;text-decoration:none;font-weight:500>Users</a><a href=/logs/ style=color:#64748b;text-decoration:none;font-weight:500>Logs</a><a href=/auth/logout style=color:#00d09c;text-decoration:none;font-weight:600;padding:4px_12px;border:1px_solid_rgba(0,208,156,0.3);border-radius:6px>Logout</a>";
          document.body.appendChild(bar);
        });
        </script>
        </head>';
        # Rewrite Kong's baked ADMIN_API_URL in kconfig.js to compute at runtime
        # from the page's origin — so the SPA works whether loaded directly at
        # :8002 or via the IT Portal /kong/ forward, without cross-origin XHR.
        sub_filter "'http://192.168.1.121/kong/api'" "(window.location.protocol+'//'+window.location.host+(window.location.pathname.indexOf('/kong/')===0||window.location.pathname==='/kong'?'/kong':'')+'/api')";
        sub_filter_once off;
        sub_filter_types application/javascript;

        # Kong Manager now lives at /kong/ inside Kong (KONG_ADMIN_GUI_PATH=/kong).
        # auth-proxy receives /foo (after /kong rewrite above) → proxy_pass adds
        # /kong/ prefix → Kong sees /kong/foo → serves Manager correctly.
        proxy_pass http://kong:8002/kong/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Authorization "";
    }

    # ─── User Management (session-protected) ─────────────────────────────
    location /users/ {
        auth_request /_auth_check;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;
        error_page 401 = @login_redirect;

        proxy_pass http://kong-usermgmt:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Audit Logs (session-protected) ──────────────────────────────────
    location /logs/ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;

        proxy_pass http://kong-usermgmt:5000/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Admin API (session-protected + CORS) ────────────────────────────
    location /api/ {
        auth_request /_auth_check;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;
        access_log /var/log/audit/access-current.jsonl audit_json;
        error_page 401 = @login_redirect;

        # CORS — accept both direct (:8002) and IT Portal /kong proxied origin.
        # When browser origin matches one of the allowed values, echo it back;
        # otherwise the request will fail CORS (defense-in-depth).
        set $cors_origin "";
        if ($http_origin = "http://192.168.1.121:8002") { set $cors_origin $http_origin; }
        if ($http_origin = "http://192.168.1.121")      { set $cors_origin $http_origin; }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization' always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://kong:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
    }

    # ─── Login redirect handler ──────────────────────────────────────────
    location @login_redirect {
        return 302 $scheme://$http_host/auth/login?next=$request_uri;
    }
}
