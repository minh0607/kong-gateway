log_format audit_json escape=json
  '{"ts":"$time_iso8601","actor":"$auth_user","actor_role":"$auth_role",'
  '"ip":"$remote_addr","event":"kong.api.request","target":null,'
  '"details":{"method":"$request_method","path":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time}}';

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/kong-proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/kong-proxy.key;
    server_name _;

    # Strip stale Basic auth cached by browsers
    proxy_set_header Authorization "";

    # ─── /aigw basePath support (IT Portal System Forward) ───────────────
    # When accessed via IT Portal as /aigw/* with preserve_prefix=1, strip
    # the /aigw prefix so the existing /auth/, /users/, /logs/, /api/, /
    # locations below still match unchanged. Kong Manager itself receives
    # /aigw/ from auth-proxy and serves correctly because KONG_ADMIN_GUI_PATH=/aigw.
    # Kong Manager probes /api (no trailing slash) on load. Without these,
    # the request falls through to location / and the Manager upstream issues
    # a 301 to http://localhost/api/ — which the browser resolves to port 80
    # (the IT Portal Next.js app), producing a noisy 404. Rewrite internally.
    # Note: specific patterns MUST come before the general /aigw/ rewrite,
    # because `last` jumps straight to location matching (not back to server-level).
    rewrite ^/aigw/api$ /api/ last;
    rewrite ^/api$      /api/ last;
    rewrite ^/aigw/(.*)$ /$1  last;
    rewrite ^/aigw$     /     last;

    # ─── Auth subrequest (any session is OK) ─────────────────────────────
    location = /_auth_check {
        internal;
        proxy_pass http://kong-usermgmt:5000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Admin-only subrequest (RBAC at the nginx layer) ─────────────────
    # Kong Manager OSS has no role separation — any logged-in user can
    # otherwise see all keys/secrets via /api/. This subrequest returns
    # 403 for non-admin sessions, blocking Kong Manager UI and Admin API.
    location = /_auth_check_admin {
        internal;
        proxy_pass http://kong-usermgmt:5000/auth/check/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── 403 forbidden page (non-admin user hits an admin-only surface) ──
    location @forbidden_page {
        default_type text/html;
        return 403 '<!DOCTYPE html><html><head><title>SEHC AI Gateway — Access Denied</title><style>body{font-family:-apple-system,sans-serif;background:#0a1628;color:#fff;padding:60px;text-align:center;margin:0}h1{color:#ff6b6b;margin-bottom:20px}a{color:#003459;background:#00d09c;text-decoration:none;padding:10px 24px;border-radius:8px;font-weight:600;display:inline-block;margin-top:20px}</style></head><body><h1>403 — Admin role required</h1><p>Your account does not have admin access to SEHC AI Gateway.</p><p>Contact your administrator to request admin role.</p><a href="/auth/logout">Logout</a></body></html>';
    }

    # ─── Auth endpoints (login/logout — public) ──────────────────────────
    location /auth/ {
        proxy_pass http://kong-usermgmt:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Model & Project Portal (admin-only; same login as the console) ──
    # Served behind the SAME _auth_check_admin gate as the console: an
    # anonymous visitor is redirected to /auth/login; a non-admin gets 403.
    # The portal's JS calls the existing /api (admin-proxied Kong Admin) with
    # the session cookie, so no separate auth is invented.
    location = /kongportal {
        auth_request /_auth_check_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;
        default_type text/html;
        alias /etc/nginx/model-portal.html;
    }

    # ─── Kong Manager GUI (main page — session-protected) ────────────────
    location / {
        auth_request /_auth_check_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;

        # Inject XHR rewrite script + logout bar + SEHC branding overlay
        sub_filter '</head>' '
        <style>
          /* Hide the Kong logo and inject "SEHC AI GATEWAY" text in its place */
          .app-navbar-logo > *, .mobile-logo > * { display: none !important; }
          .app-navbar-logo::before, .mobile-logo::before {
            content: "SEHC AI GATEWAY";
            color: #00d09c;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1.2px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            white-space: nowrap;
          }
        </style>
        <script>
        (function(){
          var hardcoded="http://192.168.1.121:8002";
          var real=window.location.protocol+"//"+window.location.host;
          // When accessed via IT Portal at /aigw/* (no :8002 port), the
          // pathname starts with /aigw. Detect this and inject the /aigw
          // prefix into rewritten URLs so /api/foo does not escape to
          // IT Portal own /api/ namespace.
          var prefix = window.location.pathname.indexOf("/aigw/")===0 || window.location.pathname==="/aigw" ? "/aigw" : "";
          if(hardcoded===real && !prefix) return;
          function rewrite(url){
            if(typeof url!=="string") return url;
            if(url.indexOf(hardcoded)===0){
              url = url.replace(hardcoded, real + prefix);
            }
            return url;
          }
          var origOpen=XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open=function(method,url){
            url = rewrite(url);
            return origOpen.apply(this,arguments.length>=3?[method,url,arguments[2],arguments[3],arguments[4]]:[method,url]);
          };
          var origFetch=window.fetch;
          window.fetch=function(input, init){
            if(typeof input==="string") input = rewrite(input);
            else if(input && input.url) input = new Request(rewrite(input.url), input);
            return origFetch.call(this, input, init);
          };
        })();
        window.addEventListener("DOMContentLoaded",function(){
          document.title = "SEHC AI Gateway";
          var bar=document.createElement("div");
          bar.id="kong-logout-bar";
          bar.style.cssText="position:fixed;top:0;right:0;z-index:99999;padding:8px 16px;background:rgba(0,52,89,0.95);border-radius:0 0 0 10px;display:flex;align-items:center;gap:12px;font-family:-apple-system,sans-serif;font-size:13px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,0.2);";
          bar.innerHTML="<span style=color:rgba(255,255,255,0.7)>SEHC AI Gateway</span><a href=/kongportal style=color:#00d09c;text-decoration:none;font-weight:600>Model Portal</a><a href=/users/ style=color:#64748b;text-decoration:none;font-weight:500>Users</a><a href=/logs/ style=color:#64748b;text-decoration:none;font-weight:500>Logs</a><a href=/auth/logout style=color:#00d09c;text-decoration:none;font-weight:600;padding:4px_12px;border:1px_solid_rgba(0,208,156,0.3);border-radius:6px>Logout</a>";
          document.body.appendChild(bar);
        });
        </script>
        </head>';
        # Rewrite Kong's baked ADMIN_API_URL in kconfig.js to compute at runtime
        # from the page's origin — so the SPA works whether loaded directly at
        # :8002 or via the IT Portal /aigw/ forward, without cross-origin XHR.
        # Kong Manager OSS prepends ADMIN_GUI_PATH (/aigw) when ADMIN_API_URL's
        # origin matches the page origin. So we set the API URL to just
        # <origin>/api — the SPA adds /aigw itself, yielding <origin>/aigw/api/...
        # which matches our location /api/ after the /aigw rewrite at the top.
        sub_filter "'http://192.168.1.121/aigw/api'" "(window.location.protocol+'//'+window.location.host+'/api')";
        sub_filter_once off;
        sub_filter_types application/javascript;

        # Kong Manager now lives at /aigw/ inside Kong (KONG_ADMIN_GUI_PATH=/aigw).
        # auth-proxy receives /foo (after /aigw rewrite above) → proxy_pass adds
        # /aigw/ prefix → Kong sees /aigw/foo → serves Manager correctly.
        proxy_pass http://kong:8002/aigw/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Authorization "";
    }

    # ─── User Management (session-protected) ─────────────────────────────
    location /users/ {
        auth_request /_auth_check_admin;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;

        proxy_pass http://kong-usermgmt:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Audit Logs (session-protected) ──────────────────────────────────
    location /logs/ {
        auth_request /_auth_check_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;

        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;

        proxy_pass http://kong-usermgmt:5000/logs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Admin API (session-protected + CORS) ────────────────────────────
    location /api/ {
        auth_request /_auth_check_admin;
        auth_request_set $auth_user  $upstream_http_x_auth_user;
        auth_request_set $auth_role  $upstream_http_x_auth_role;
        access_log /var/log/audit/access-current.jsonl audit_json;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;

        # CORS — accept both direct (:8002) and IT Portal /aigw proxied origin.
        # When browser origin matches one of the allowed values, echo it back;
        # otherwise the request will fail CORS (defense-in-depth).
        set $cors_origin "";
        if ($http_origin = "http://192.168.1.121:8002") { set $cors_origin $http_origin; }
        if ($http_origin = "http://192.168.1.121")      { set $cors_origin $http_origin; }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization' always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://kong:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
    }

    # ─── Prometheus metrics (read-only) for the portal Usage tab ─────────
    # Kong's Status API (:8100) exposes /metrics in Prometheus text format,
    # including per-consumer + per-service counters (per_consumer=true). Behind
    # the SAME admin gate as the console; the portal parses it client-side.
    location = /metrics {
        auth_request /_auth_check_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;
        proxy_pass http://kong:8100/metrics;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
    }

    # ─── Request log (read-only) for the portal Requests tab ─────────────
    # Kong's file-log plugin writes one JSON object per request (client_ip,
    # consumer, service, status, latency) to this shared file. Served as a
    # static file so the portal can Range-fetch just the tail; admin-gated.
    location = /requests {
        auth_request /_auth_check_admin;
        error_page 401 = @login_redirect;
        error_page 403 = @forbidden_page;
        default_type application/x-ndjson;
        add_header Accept-Ranges bytes;
        alias /kong-reqlog/requests.log;
    }

    # ─── Login redirect handler ──────────────────────────────────────────
    location @login_redirect {
        return 302 $scheme://$http_host/auth/login?next=$request_uri;
    }
}
