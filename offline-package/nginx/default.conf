server {
    listen 80;
    server_name _;

    # Strip stale Basic auth cached by browsers
    proxy_set_header Authorization "";

    # ─── Auth subrequest ─────────────────────────────────────────────────
    location = /_auth_check {
        internal;
        proxy_pass http://kong-usermgmt:5000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Auth endpoints (login/logout — public) ──────────────────────────
    location /auth/ {
        proxy_pass http://kong-usermgmt:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Kong Manager GUI (main page — session-protected) ────────────────
    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        # Inject XHR rewrite script + logout bar
        sub_filter '</head>' '
        <script>
        (function(){
          var hardcoded="http://192.168.1.121:8002";
          var real=window.location.protocol+"//"+window.location.host;
          if(hardcoded===real) return;
          var origOpen=XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open=function(method,url){
            if(typeof url==="string" && url.indexOf(hardcoded)===0){
              url=url.replace(hardcoded,real);
            }
            return origOpen.apply(this,arguments.length>=3?[method,url,arguments[2],arguments[3],arguments[4]]:[method,url]);
          };
        })();
        window.addEventListener("DOMContentLoaded",function(){
          var bar=document.createElement("div");
          bar.id="kong-logout-bar";
          bar.style.cssText="position:fixed;top:0;right:0;z-index:99999;padding:8px 16px;background:rgba(0,52,89,0.95);border-radius:0 0 0 10px;display:flex;align-items:center;gap:12px;font-family:-apple-system,sans-serif;font-size:13px;backdrop-filter:blur(8px);box-shadow:0 2px 12px rgba(0,0,0,0.2);";
          bar.innerHTML="<span style=color:rgba(255,255,255,0.7)>Kong Admin</span><a href=/users/ style=color:#64748b;text-decoration:none;font-weight:500>Users</a><a href=/auth/logout style=color:#00d09c;text-decoration:none;font-weight:600;padding:4px_12px;border:1px_solid_rgba(0,208,156,0.3);border-radius:6px>Logout</a>";
          document.body.appendChild(bar);
        });
        </script>
        </head>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_pass http://kong:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Authorization "";
    }

    # ─── User Management (session-protected) ─────────────────────────────
    location /users/ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        proxy_pass http://kong-usermgmt:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    # ─── Admin API (session-protected + CORS) ────────────────────────────
    location /api/ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;

        # CORS — allow any origin
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization' always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Kong-Admin-Token,Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://kong:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
    }

    # ─── Login redirect handler ──────────────────────────────────────────
    location @login_redirect {
        return 302 $scheme://$http_host/auth/login?next=$request_uri;
    }
}
