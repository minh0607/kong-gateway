volumes:
  pg_data: {}
  kong_auth_data: {}

networks:
  kong-net:
    driver: bridge

x-kong-config: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: kong_pass
  KONG_PG_DATABASE: kong

services:

  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_pass
      POSTGRES_DB: kong
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10

  kong-bootstrap:
    image: kong:3.9
    container_name: kong-bootstrap
    networks:
      - kong-net
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *kong-env
    command: kong migrations bootstrap

  kong:
    image: kong:3.9
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://192.168.1.121:8002
      KONG_ADMIN_GUI_API_URL: http://192.168.1.121:8002/api
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8001:8001"  # Admin API HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8444:8444"  # Admin API HTTPS
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  kong-auth-proxy:
    image: nginx:alpine
    container_name: kong-auth-proxy
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/portal.html:/etc/nginx/portal.html:ro
      - kong_auth_data:/data
    ports:
      - "8002:80"  # Kong Manager GUI (session auth + logout)
    networks:
      - kong-net

  kong-usermgmt:
    image: kong-usermgmt:latest
    container_name: kong-usermgmt
    restart: unless-stopped
    volumes:
      - ./nginx/.htpasswd:/data/.htpasswd
      - kong_auth_data:/data
    environment:
      HTPASSWD_FILE: /data/.htpasswd
      ROLES_FILE: /data/roles.json
    ports:
      - "8888:5000"  # User Management GUI (admin-only)
    networks:
      - kong-net
