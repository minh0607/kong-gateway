volumes:
  pg_data: {}

networks:
  kong-net:
    driver: bridge

x-kong-config: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: kong-database
  KONG_PG_USER: kong
  KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:?must be set}
  KONG_PG_DATABASE: kong

services:

  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:?must be set}
      POSTGRES_DB: kong
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10

  kong-bootstrap:
    image: kong:3.9
    container_name: kong-bootstrap
    networks:
      - kong-net
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure
    environment:
      <<: *kong-env
    command: kong migrations bootstrap

  kong:
    image: kong:3.9
    container_name: kong
    restart: unless-stopped
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      # Default proxy TLS cert (self-signed for IP 192.168.1.121). IP clients send
      # no SNI, so the default cert is what they get on :8443.
      KONG_SSL_CERT: /etc/kong/ssl/kong-proxy.crt
      KONG_SSL_CERT_KEY: /etc/kong/ssl/kong-proxy.key
      # Status API (read-only): exposes /status + /metrics (Prometheus format)
      # for external scraping by Zabbix. Safer to publish than the Admin API.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      # Served behind IT Portal at /aigw via System Forward (preserve_prefix=1).
      # GUI_PATH tells Kong Manager's Vue Router to use /aigw as basePath.
      # Direct :8002 access now lives under /aigw/ as well.
      KONG_ADMIN_GUI_PATH: /aigw
      KONG_ADMIN_GUI_URL: http://192.168.1.121/aigw
      KONG_ADMIN_GUI_API_URL: http://192.168.1.121/aigw/api
      # Long-running LLM streams (Claude Code, large outputs) need timeouts well
      # above nginx's 60s default, else Kong cuts the client mid-stream
      # ("client timed out while sending to client", errno 110). These are
      # http-level → they cover EVERY proxy route at once. Per-route upstream
      # read/write_timeout (Kong↔vLLM) is set separately via the Admin API.
      KONG_NGINX_HTTP_SEND_TIMEOUT: 600s
      KONG_NGINX_HTTP_KEEPALIVE_TIMEOUT: 620s
      KONG_NGINX_HTTP_CLIENT_BODY_TIMEOUT: 600s
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8001:8001"  # Admin API HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8444:8444"  # Admin API HTTPS
      - "8100:8100"  # Status API + Prometheus /metrics (for Zabbix)
    volumes:
      - ./ssl:/etc/kong/ssl:ro
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  kong-auth-proxy:
    image: nginx:alpine
    container_name: kong-auth-proxy
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/portal.html:/etc/nginx/portal.html:ro
      - ./portal/portal.html:/etc/nginx/model-portal.html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./data/audit:/var/log/audit
    ports:
      - "8002:80"
      - "8452:443"
    networks:
      - kong-net

  kong-usermgmt:
    image: kong-usermgmt:latest
    container_name: kong-usermgmt
    restart: unless-stopped
    volumes:
      - ./nginx/.htpasswd:/data/.htpasswd
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HTPASSWD_FILE: /data/.htpasswd
      USERS_FILE: /data/users.json
      MFA_STATE_FILE: /data/mfa_state.json
      LOCKOUTS_FILE: /data/lockouts.json
      AUDIT_DIR: /data/audit
      SESSION_SECRET: ${SESSION_SECRET:?must be set}
      SESSION_MAX_AGE: "1800"

      SMTP_HOST: ${SMTP_HOST:?must be set}
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "SEHC AI Gateway <no-reply@sehc.local>"
      SMTP_USE_TLS: "true"
      SMTP_TIMEOUT_SEC: "10"

      MFA_ENFORCED: ${MFA_ENFORCED:-false}
      MFA_CODE_TTL_SEC: "300"
      MFA_MAX_ATTEMPTS: "3"
      MFA_RESEND_COOLDOWN_SEC: "60"

      PWD_LOCKOUT_THRESHOLD: "5"
      PWD_LOCKOUT_WINDOW_SEC: "900"
      IP_MFA_LOCKOUT_THRESHOLD: "10"
      IP_MFA_LOCKOUT_WINDOW_SEC: "900"

      AUDIT_RETENTION_DAYS: "90"
      AUTH_PROXY_CONTAINER: "kong-auth-proxy"
      TZ: "UTC"
    ports:
      - "8888:5000"
    networks:
      - kong-net
