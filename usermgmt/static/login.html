<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEHC AI Gateway — Sign in</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f9fafb; --card:#ffffff; --text:#0f172a; --sub:#6b7280; --line:#e5e7eb; --input:#f9fafb;
    --primary:#3b82f6; --primary-h:#2563eb; --primary-l:#eff6ff; --primary-t:#1d4ed8;
    --grad:linear-gradient(135deg,#3b82f6,#2563eb);
    --shadow:0 24px 60px -15px rgba(15,23,42,.18),0 8px 20px -12px rgba(15,23,42,.12);
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
    --ok:#059669; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --blob1:rgba(59,130,246,.16); --blob2:rgba(139,92,246,.14); --dot:rgba(15,23,42,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a;
    --primary-l:#1e293b; --primary-t:#93c5fd;
    --shadow:0 24px 60px -15px rgba(0,0,0,.6),0 8px 20px -12px rgba(0,0,0,.5);
    --danger-bg:#2a1416; --danger-line:#7f1d1d; --ok-bg:#052e23; --ok-line:#065f46;
    --blob1:rgba(59,130,246,.18); --blob2:rgba(139,92,246,.16); --dot:rgba(255,255,255,.045);
  }}
  :root[data-theme="dark"]{
    --bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a;
    --primary-l:#1e293b; --primary-t:#93c5fd;
    --shadow:0 24px 60px -15px rgba(0,0,0,.6),0 8px 20px -12px rgba(0,0,0,.5);
    --danger-bg:#2a1416; --danger-line:#7f1d1d; --ok-bg:#052e23; --ok-line:#065f46;
    --blob1:rgba(59,130,246,.18); --blob2:rgba(139,92,246,.16); --dot:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  /* animated backdrop */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(120px)}
  .blob.a{top:-8%;left:8%;width:560px;height:560px;background:var(--blob1);animation:float 16s ease-in-out infinite}
  .blob.b{bottom:-10%;right:6%;width:480px;height:480px;background:var(--blob2);animation:float 20s ease-in-out infinite reverse}
  .grid{position:absolute;inset:0;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1px);background-size:46px 46px}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .wrap{width:100%;max-width:410px;animation:rise .5s cubic-bezier(.16,1,.3,1)}
  .brand{text-align:center;margin-bottom:26px}
  .brand img{height:34px;object-fit:contain;margin-bottom:14px}
  .brand .ll{display:inline-block} .brand .dl{display:none}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .ll{display:none} :root:not([data-theme="light"]) .brand .dl{display:inline-block}}
  :root[data-theme="dark"] .brand .ll{display:none} :root[data-theme="dark"] .brand .dl{display:inline-block}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .brand p{font-size:13px;color:var(--sub);margin-top:4px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent)}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .head .ico{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(37,99,235,.5)}
  .head .ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7}
  .head h2{font-size:17px;font-weight:700}
  .head p{font-size:12.5px;color:var(--sub);margin-top:2px}
  .fg{margin-bottom:16px}
  .fg label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:7px;letter-spacing:.02em}
  .field{position:relative}
  .field>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--sub);fill:none;stroke-width:1.7;pointer-events:none}
  .field input{width:100%;padding:12px 14px 12px 42px;background:var(--input);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:14.5px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  .field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
  .field .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:var(--sub);display:flex}
  .field .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
  .field .eye:hover{color:var(--primary)}
  .code-input input{text-align:center;letter-spacing:.5em;font-size:20px;font-weight:700;padding-left:14px;font-family:ui-monospace,monospace}
  .btn{width:100%;padding:13px;background:var(--grad);border:0;border-radius:12px;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px -8px rgba(37,99,235,.55);transition:filter .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:9px}
  .btn:hover:not(:disabled){filter:brightness(1.06)} .btn:active:not(:disabled){transform:scale(.985)}
  .btn:disabled{opacity:.65;cursor:not-allowed}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .alert{display:none;padding:11px 14px;border-radius:11px;margin-bottom:18px;font-size:13.5px;font-weight:500;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line)}
  .alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
  .mfa-note{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--primary-l);border:1px solid var(--line);margin-bottom:18px}
  .mfa-note svg{width:20px;height:20px;flex:0 0 auto;stroke:var(--primary);fill:none;stroke-width:1.6;margin-top:1px}
  .mfa-note p{font-size:12.5px;color:var(--text);line-height:1.5}
  .mfa-note b{color:var(--primary-t)}
  .meta{text-align:center;font-size:12px;color:var(--sub);margin-top:12px}
  .link{background:none;border:0;color:var(--primary);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;font-family:inherit}
  .link:hover{text-decoration:underline}
  .foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:22px;opacity:.85}
</style>
</head>

<script>
let challengeId=null,countdownTimer=null,expiresAt=0;

function showError(msg,ok){const el=document.getElementById('alert');el.textContent=msg;el.className='alert'+(ok?' ok':'');el.style.display='block';setTimeout(()=>el.style.display='none',ok?3000:4500);}
function showStep(name){document.getElementById('password-form').style.display=name==='password'?'':'none';document.getElementById('mfa-form').style.display=name==='mfa'?'':'none';}
function busy(which,on){const b=document.getElementById(which===1?'loginBtn':'verifyBtn');const s=document.getElementById(which===1?'s1':'s2');const t=document.getElementById(which===1?'t1':'t2');b.disabled=on;s.style.display=on?'inline-block':'none';t.textContent=on?(which===1?'Signing in…':'Verifying…'):(which===1?'Sign in':'Verify');}
function togglePw(){const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';document.getElementById('eye').style.color=i.type==='text'?'var(--primary)':'';}

function startCountdown(sec){expiresAt=Date.now()+sec*1000;if(countdownTimer)clearInterval(countdownTimer);const el=document.getElementById('countdown');
  function tick(){const left=Math.max(0,Math.floor((expiresAt-Date.now())/1000));el.textContent=`Code expires in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left===0)clearInterval(countdownTimer);}
  tick();countdownTimer=setInterval(tick,1000);}

async function doPassword(e){e.preventDefault();busy(1,true);
  const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;
  try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){showError(data.error||'Login failed');return;}
    if(data.step==='mfa_required'){challengeId=data.challenge_id;document.getElementById('masked-email').textContent=data.masked_email;showStep('mfa');startCountdown(data.expires_in);document.getElementById('code').focus();}
    else if(data.step==='ok'){goNext();}
  }catch(err){showError('Connection error.');}finally{busy(1,false);}}

async function doCode(e){e.preventDefault();busy(2,true);
  const code=document.getElementById('code').value.trim();
  try{const r=await fetch('/auth/mfa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:challengeId,code})});
    const data=await r.json();
    if(!r.ok){showError(data.error||'Invalid code');if(r.status===410)backToPassword();return;}
    goNext();
  }catch(err){showError('Connection error.');}finally{busy(2,false);}}

async function doResend(){try{const r=await fetch('/auth/mfa/resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:challengeId})});
    const data=await r.json();
    if(!r.ok){showError(data.error||'Could not resend');return;}
    showError('A new code has been sent.',true);startCountdown(300);
  }catch(err){showError('Connection error.');}}

function backToPassword(){challengeId=null;if(countdownTimer)clearInterval(countdownTimer);document.getElementById('code').value='';showStep('password');document.getElementById('username').focus();}
function goNext(){const params=new URLSearchParams(window.location.search);const next=params.get('next')||'/';window.location.href=next;}
</script>
