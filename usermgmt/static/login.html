<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kong Gateway — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a1628;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,156,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,156,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .login-card {
    position: relative;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 48px 40px 40px;
    width: 400px;
    max-width: 92%;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #00d09c, #003459);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: white;
    box-shadow: 0 4px 20px rgba(0,208,156,0.3);
  }
  .logo-text h1 {
    font-size: 20px; font-weight: 700; color: #fff;
    letter-spacing: -0.3px;
  }
  .logo-text p {
    font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px;
  }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; margin-bottom: 7px;
    font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff; font-size: 15px;
    transition: all 0.2s;
  }
  .form-group input::placeholder { color: rgba(255,255,255,0.25); }
  .form-group input:focus {
    outline: none;
    border-color: #00d09c;
    box-shadow: 0 0 0 3px rgba(0,208,156,0.15);
    background: rgba(255,255,255,0.08);
  }

  .btn-login {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #00d09c, #00b386);
    border: none; border-radius: 10px;
    color: #003459; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.3px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(0,208,156,0.25);
  }
  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(0,208,156,0.35);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled {
    opacity: 0.6; cursor: not-allowed; transform: none;
  }

  .alert {
    padding: 11px 16px; border-radius: 8px;
    margin-bottom: 20px; font-size: 14px;
    display: none;
    background: rgba(244,67,54,0.15);
    color: #ff6b6b;
    border: 1px solid rgba(244,67,54,0.2);
  }

  .session-info {
    margin-top: 20px; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.3);
  }
  .session-info span { color: #00d09c; }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="login-card">
  <div class="logo-row">
    <div class="logo-icon">K</div>
    <div class="logo-text">
      <h1>Kong Gateway</h1>
      <p>Admin Authentication</p>
    </div>
  </div>

  <div id="alert" class="alert"></div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" required autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
  </form>

  <div class="session-info">
    Session expires after <span>30 minutes</span> of inactivity
  </div>
</div>

<script>
function showError(msg) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Login failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }

    // Redirect to the originally requested page or Kong Manager
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';
    window.location.href = next;
  } catch (err) {
    showError('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
