<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEHC AI Gateway — User Management</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f9fafb; --card:#ffffff; --text:#0f172a; --sub:#6b7280; --line:#e5e7eb; --input:#f9fafb; --hover:#f3f4f6;
    --primary:#3b82f6; --primary-h:#2563eb; --primary-l:#eff6ff; --primary-t:#1d4ed8; --grad:linear-gradient(135deg,#3b82f6,#2563eb);
    --sidebar:#0f172a;
    --shadow:0 10px 15px -3px rgba(15,23,42,.06),0 4px 6px -4px rgba(15,23,42,.05);
    --amber:#b45309; --amber-bg:#fffbeb; --amber-line:#fde68a;
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
    --ok:#059669; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a; --hover:#334155;
    --primary-l:#0f213f; --primary-t:#93c5fd;
    --shadow:0 10px 15px -3px rgba(0,0,0,.4);
    --amber-bg:#2a2010; --amber-line:#78581a; --danger-bg:#2a1416; --danger-line:#7f1d1d; --ok-bg:#052e23; --ok-line:#065f46;
  }}
  :root[data-theme="dark"]{
    --bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a; --hover:#334155;
    --primary-l:#0f213f; --primary-t:#93c5fd; --shadow:0 10px 15px -3px rgba(0,0,0,.4);
    --amber-bg:#2a2010; --amber-line:#78581a; --danger-bg:#2a1416; --danger-line:#7f1d1d; --ok-bg:#052e23; --ok-line:#065f46;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:inherit;text-decoration:none}
  .topbar{background:var(--sidebar);color:#fff;height:60px;display:flex;align-items:center;gap:13px;padding:0 24px;position:sticky;top:0;z-index:20}
  .topbar .lg{height:26px;object-fit:contain}
  .topbar h1{font-size:15.5px;font-weight:700;letter-spacing:.2px}
  .topbar .sep{width:1px;height:24px;background:rgba(255,255,255,.15);margin:0 4px}
  .topbar .rt{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:13px;font-weight:600}
  .topbar .rt a{color:rgba(255,255,255,.65)} .topbar .rt a:hover{color:#fff}
  .container{max-width:760px;margin:26px auto;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .chead{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .chead .cico{width:32px;height:32px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
  .chead .cico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.7}
  .cico.blue{background:var(--grad)} .cico.slate{background:linear-gradient(135deg,#64748b,#475569)} .cico.amber{background:linear-gradient(135deg,#fbbf24,#d97706)}
  .chead h2{font-size:15px;font-weight:700;flex:1}
  .cbody{padding:20px}
  .fg{margin-bottom:14px}
  .fg label{display:block;margin-bottom:6px;font-weight:600;font-size:12.5px;color:var(--sub)}
  .fg input,.fg select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--input);color:var(--text);font-family:inherit}
  .fg input:focus,.fg select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
  .frow{display:flex;gap:12px} .frow .fg{flex:1}
  .btn{padding:9px 16px;border:1px solid transparent;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:filter .15s,background .15s,transform .1s;color:#fff;background:var(--grad);box-shadow:0 8px 16px -8px rgba(37,99,235,.5)}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;box-shadow:none}
  .btn.ghost{background:var(--card);color:var(--text);border-color:var(--line);box-shadow:none} .btn.ghost:hover{background:var(--hover);filter:none;border-color:var(--primary)}
  .btn.role{background:var(--primary-l);color:var(--primary-t);box-shadow:none} .btn.role:hover{filter:brightness(.97)}
  .btn.warn{background:linear-gradient(135deg,#fbbf24,#d97706);box-shadow:none}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:none}
  .btn.mfaon{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line);box-shadow:none}
  .btn.mfaoff{background:var(--hover);color:var(--sub);box-shadow:none}
  .urow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .urow:last-child{border-bottom:none}
  .uinfo{display:flex;align-items:center;gap:11px;min-width:0}
  .uav{width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .uav.admin{background:var(--amber-bg);color:var(--amber)} .uav.user{background:var(--primary-l);color:var(--primary-t)}
  .uname{font-weight:700}
  .ubadge{padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .ubadge.admin{background:var(--amber-bg);color:var(--amber)} .ubadge.user{background:var(--primary-l);color:var(--primary-t)}
  .uemail{font-size:12.5px;color:var(--sub)}
  .uactions{display:flex;gap:6px;flex-wrap:wrap}
  .alert{padding:11px 15px;border-radius:11px;margin-bottom:16px;font-size:13.5px;font-weight:500;display:none;border:1px solid transparent}
  .alert-success{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
  .alert-error{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
  .count{background:var(--primary-l);color:var(--primary-t);padding:2px 11px;border-radius:20px;font-size:12.5px;font-weight:700}
  .empty{text-align:center;padding:26px;color:var(--sub)}
  .access-denied{text-align:center;padding:64px 20px}
  .access-denied .cico{width:52px;height:52px;border-radius:14px;margin:0 auto 16px;background:linear-gradient(135deg,#ef4444,#dc2626);display:flex;align-items:center;justify-content:center}
  .access-denied .cico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.6}
  .access-denied h2{margin-bottom:8px;font-size:19px}
  .access-denied p{color:var(--sub)}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
  .modal-overlay.active{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:420px;max-width:100%;box-shadow:0 24px 60px -15px rgba(0,0,0,.4)}
  .modal h3{margin-bottom:16px;font-size:16px;font-weight:700}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  small.hint{color:var(--sub);font-size:12px;display:none;margin-top:4px}
</style>
</head>

  <span class="sep"></span>
  <h1>User Management</h1>
  <div class="rt">
    <a href="/kongportal">Model Portal</a>
    <a href="/">Kong Manager</a>
  </div>
</div>

<div class="container">
  <div id="alert" class="alert"></div>
  <div id="accessDenied" class="access-denied" style="display:none;">
    <div class="cico"><svg viewBox="0 0 24 24"><path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg></div>
    <h2>Access denied</h2>
    <p>Only admin users can manage accounts.</p>
    <p style="margin-top:16px;"><a href="/" style="color:var(--primary);font-weight:600">Back to Kong Manager</a></p>
  </div>

  <div id="mainContent">
    <!-- Add User -->
    <div class="card">
      <div class="chead"><span class="cico blue"><svg viewBox="0 0 24 24"><path d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM3 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 019.374 21c-2.331 0-4.512-.645-6.374-1.766z"/></svg></span><h2>Add new user</h2></div>
      <div class="cbody">
        <form id="addForm" onsubmit="addUser(event)">
          <div class="frow">
            <div class="fg"><label>Username</label><input type="text" id="newUsername" placeholder="Enter username" required minlength="3"></div>
            <div class="fg"><label>Password</label><input type="password" id="newPassword" placeholder="Enter password" required minlength="6"></div>
          </div>
          <div class="fg"><label>Email <span style="font-weight:400">(optional)</span></label><input type="email" id="newEmail" placeholder="user@example.com"></div>
          <div class="fg"><label>Role</label>
            <select id="newRole">
              <option value="user">User — Kong Manager access only</option>
              <option value="admin">Admin — Kong Manager + User Management</option>
            </select>
          </div>
          <button type="submit" class="btn">Add user</button>
        </form>
      </div>
    </div>

    <!-- User List -->
    <div class="card">
      <div class="chead"><span class="cico slate"><svg viewBox="0 0 24 24"><path d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg></span><h2>Users</h2><span class="count" id="userCount">0</span></div>
      <div class="cbody" id="userList"><div class="empty">Loading…</div></div>
    </div>

    <!-- SMTP Settings -->
    <div class="card">
      <div class="chead"><span class="cico amber"><svg viewBox="0 0 24 24"><path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg></span><h2>SMTP settings <span class="uemail" style="font-weight:400">— for MFA emails</span></h2></div>
      <div class="cbody">
        <div id="smtpAlert" class="alert"></div>
        <form id="smtpForm" onsubmit="saveSmtp(event)">
          <div class="frow">
            <div class="fg"><label>Host</label><input type="text" id="smtpHost" placeholder="mail.example.com"></div>
            <div class="fg" style="max-width:110px;"><label>Port</label><input type="number" id="smtpPort" placeholder="587" min="1" max="65535"></div>
          </div>
          <div class="frow">
            <div class="fg"><label>Username</label><input type="text" id="smtpUser" placeholder="relay@example.com"></div>
            <div class="fg"><label>Password</label><input type="password" id="smtpPassword" placeholder="(unchanged)" autocomplete="new-password"><small id="smtpPassHint" class="hint">currently set</small></div>
          </div>
          <div class="fg"><label>From address</label><input type="text" id="smtpFrom" placeholder="SEHC AI Gateway &lt;no-reply@example.com&gt;"></div>
          <div class="frow">
            <div class="fg" style="flex:0;white-space:nowrap;"><label>Use TLS</label><input type="checkbox" id="smtpTls" style="width:auto;margin-top:9px;"></div>
            <div class="fg" style="max-width:150px;"><label>Timeout (sec)</label><input type="number" id="smtpTimeout" placeholder="10" min="1" max="120"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:4px;">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn ghost" onclick="testSmtp()">Send test email</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Change Password Modal -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal">
    <h3>Change password</h3>
    <div class="fg"><label>New password for <strong id="modalUser"></strong></label><input type="password" id="modalPassword" placeholder="Enter new password" minlength="6"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn warn" onclick="savePassword()">Save</button>
    </div>
  </div>
</div>

<script>
function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.className = 'alert alert-' + type;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  if (res.status === 403) {
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('accessDenied').style.display = 'block';
    throw new Error('Access denied');
  }
  if (res.status === 401) { window.location.href = '/auth/login'; throw new Error('Not authenticated'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadUsers() {
  try {
    const data = await api('GET', 'api/users');
    const list = document.getElementById('userList');
    document.getElementById('userCount').textContent = data.users.length;
    if (data.users.length === 0) { list.innerHTML = '<div class="empty">No users found</div>'; return; }
    list.innerHTML = data.users.map(u => `
      <div class="urow">
        <div class="uinfo">
          <div class="uav ${u.role}">${u.username[0].toUpperCase()}</div>
          <div>
            <span class="uname">${u.username}</span>
            <span class="ubadge ${u.role}">${u.role}</span>
            ${u.email ? `<div class="uemail">${u.email}</div>` : ''}
          </div>
        </div>
        <div class="uactions">
          <button class="btn role sm" onclick="toggleRole('${u.username}','${u.role}')">${u.role === 'admin' ? 'Demote' : 'Promote'}</button>
          <button class="btn warn sm" onclick="openPasswordModal('${u.username}')">Password</button>
          <button class="btn ghost sm" onclick="editEmail('${u.username}','${u.email || ''}')">Email</button>
          <button class="btn ${u.mfa_enabled ? 'mfaon' : 'mfaoff'} sm" onclick="toggleMfa('${u.username}',${u.mfa_enabled})">MFA: ${u.mfa_enabled ? 'on' : 'off'}</button>
          <button class="btn danger sm" onclick="deleteUser('${u.username}')">Delete</button>
        </div>
      </div>`).join('');
  } catch (e) {
    if (e.message !== 'Access denied' && e.message !== 'Not authenticated') showAlert(e.message, 'error');
  }
}

async function addUser(e) {
  e.preventDefault();
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value.trim();
  const role = document.getElementById('newRole').value;
  const email = document.getElementById('newEmail').value.trim();
  const body = { username, password, role };
  if (email) body.email = email;
  try { const data = await api('POST', 'api/users', body); showAlert(data.message, 'success'); document.getElementById('addForm').reset(); loadUsers(); }
  catch (e) { showAlert(e.message, 'error'); }
}

async function deleteUser(username) {
  if (!confirm(`Delete user "${username}"?`)) return;
  try { const data = await api('DELETE', `api/users/${username}`); showAlert(data.message, 'success'); loadUsers(); }
  catch (e) { showAlert(e.message, 'error'); }
}

async function toggleRole(username, currentRole) {
  const newRole = currentRole === 'admin' ? 'user' : 'admin';
  const action = newRole === 'admin' ? 'Promote' : 'Demote';
  if (!confirm(`${action} "${username}" to ${newRole}?`)) return;
  try { const data = await api('PUT', `api/users/${username}/role`, { role: newRole }); showAlert(data.message, 'success'); loadUsers(); }
  catch (e) { showAlert(e.message, 'error'); }
}

function openPasswordModal(username) {
  document.getElementById('modalUser').textContent = username;
  document.getElementById('modalPassword').value = '';
  document.getElementById('passwordModal').classList.add('active');
}
function closeModal() { document.getElementById('passwordModal').classList.remove('active'); }

async function savePassword() {
  const username = document.getElementById('modalUser').textContent;
  const password = document.getElementById('modalPassword').value.trim();
  if (!password) return;
  try { const data = await api('PUT', `api/users/${username}/password`, { password }); showAlert(data.message, 'success'); closeModal(); }
  catch (e) { showAlert(e.message, 'error'); }
}

async function editEmail(username, current) {
  const newValue = prompt(`Email for "${username}":`, current);
  if (newValue === null) return;
  try { const data = await api('PUT', `api/users/${username}/email`, { email: newValue.trim() }); showAlert(data.message, 'success'); loadUsers(); }
  catch (e) { showAlert(e.message, 'error'); }
}

function showSmtpAlert(msg, type) {
  const el = document.getElementById('smtpAlert');
  el.className = 'alert alert-' + type;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

async function loadSmtp() {
  try {
    const data = await api('GET', 'api/smtp');
    document.getElementById('smtpHost').value = data.host || '';
    document.getElementById('smtpPort').value = data.port || '';
    document.getElementById('smtpUser').value = data.user || '';
    document.getElementById('smtpFrom').value = data.from_addr || '';
    document.getElementById('smtpTls').checked = !!data.use_tls;
    document.getElementById('smtpTimeout').value = data.timeout_sec || '';
    document.getElementById('smtpPassword').value = '';
    document.getElementById('smtpPassHint').style.display = data.pass_set ? 'block' : 'none';
  } catch (e) { /* non-admin or load error — silently skip */ }
}

async function saveSmtp(e) {
  e.preventDefault();
  const body = {
    host: document.getElementById('smtpHost').value.trim(),
    port: parseInt(document.getElementById('smtpPort').value, 10),
    user: document.getElementById('smtpUser').value.trim(),
    from_addr: document.getElementById('smtpFrom').value.trim(),
    use_tls: document.getElementById('smtpTls').checked,
    timeout_sec: parseInt(document.getElementById('smtpTimeout').value, 10),
  };
  const pw = document.getElementById('smtpPassword').value;
  if (pw) body.password = pw;
  try { const data = await api('PUT', 'api/smtp', body); showSmtpAlert(data.message, 'success'); document.getElementById('smtpPassword').value = ''; loadSmtp(); }
  catch (e) { showSmtpAlert(e.message, 'error'); }
}

async function testSmtp() {
  try { const data = await api('POST', 'api/smtp/test', {}); showSmtpAlert(data.message, 'success'); }
  catch (e) { showSmtpAlert(e.message, 'error'); }
}

async function toggleMfa(username, current) {
  try { const data = await api('PUT', `api/users/${username}/mfa`, { enabled: !current }); showAlert(data.message, 'success'); loadUsers(); }
  catch (e) { showAlert(e.message, 'error'); }
}

loadUsers();
loadSmtp();
</script>
</body>
</html>
