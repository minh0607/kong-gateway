<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEHC AI Gateway — Audit Log</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#f9fafb; --card:#ffffff; --text:#0f172a; --sub:#6b7280; --line:#e5e7eb; --input:#f9fafb; --hover:#f3f4f6;
    --primary:#3b82f6; --primary-t:#1d4ed8; --grad:linear-gradient(135deg,#3b82f6,#2563eb); --sidebar:#0f172a;
    --shadow:0 10px 15px -3px rgba(15,23,42,.06),0 4px 6px -4px rgba(15,23,42,.05);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a; --hover:#334155;
    --primary-t:#93c5fd; --shadow:0 10px 15px -3px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{--bg:#030712; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155; --input:#0f172a; --hover:#334155; --primary-t:#93c5fd; --shadow:0 10px 15px -3px rgba(0,0,0,.4)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:inherit;text-decoration:none}
  .topbar{background:var(--sidebar);color:#fff;height:60px;display:flex;align-items:center;gap:13px;padding:0 24px;position:sticky;top:0;z-index:20}
  .topbar .lg{height:26px;object-fit:contain} .topbar .sep{width:1px;height:24px;background:rgba(255,255,255,.15);margin:0 4px}
  .topbar h1{font-size:15.5px;font-weight:700}
  .topbar .rt{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:13px;font-weight:600}
  .topbar .rt a{color:rgba(255,255,255,.65)} .topbar .rt a:hover{color:#fff}
  .container{max-width:1200px;margin:22px auto;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 18px}
  .filters input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);font-size:13.5px;font-family:inherit}
  .filters input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
  .btn{padding:9px 16px;border:0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;color:#fff;background:var(--grad);box-shadow:0 8px 16px -8px rgba(37,99,235,.5)}
  .btn:hover{filter:brightness(1.06)}
  .btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none} .btn.sec:hover{background:var(--hover)}
  .btn.sec:disabled{opacity:.45;cursor:not-allowed}
  .twrap{overflow:auto;border-radius:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:11px;padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:pointer;transition:background .1s} tbody tr:hover{background:var(--hover)}
  code{font-family:ui-monospace,monospace;font-size:12px}
  .pager{display:flex;gap:8px;align-items:center;padding:14px 18px}
  .pager .info{color:var(--sub);font-size:13px}
  pre{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;margin-bottom:24px}
</style>
</head>

  <span class="sep"></span>
  <h1>Audit Log</h1>
  <div class="rt">
    <a href="/users/">Users</a>
    <a href="/kongportal">Model Portal</a>
    <a href="/">Kong Manager</a>
    <a href="/auth/logout">Logout</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="filters">
      <input id="date" type="date">
      <input id="actor" type="text" placeholder="actor (exact)">
      <input id="event" type="text" placeholder="event (glob: login.*)">
      <button class="btn" onclick="load(0)">Search</button>
    </div>
  </div>

  <div class="card">
    <div class="twrap">
      <table>
        <thead><tr><th>ts (UTC)</th><th>actor</th><th>role</th><th>ip</th><th>event</th><th>target</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="btn sec" id="prev" onclick="load(offset - limit)">‹ Newer</button>
      <span class="info" id="info"></span>
      <button class="btn sec" id="next" onclick="load(offset + limit)">Older ›</button>
    </div>
  </div>

  <pre id="detail" hidden></pre>
</div>

<script>
const limit = 200;
let offset = 0;
let total = 0;

document.getElementById('date').value = new Date().toISOString().slice(0, 10);

async function load(off) {
  offset = Math.max(0, off);
  const params = new URLSearchParams({
    date: document.getElementById('date').value,
    actor: document.getElementById('actor').value,
    event: document.getElementById('event').value,
    limit, offset,
  });
  for (const k of [...params.keys()]) if (!params.get(k)) params.delete(k);
  const r = await fetch(`/logs/api?${params.toString()}`, { credentials: 'include' });
  if (!r.ok) {
    document.getElementById('rows').innerHTML = `<tr><td colspan=6>Error: ${r.status}</td></tr>`;
    return;
  }
  const data = await r.json();
  total = data.total;
  document.getElementById('rows').innerHTML = data.rows.map(row => `
    <tr onclick='showDetail(${JSON.stringify(JSON.stringify(row))})'>
      <td><code>${row.ts || ''}</code></td>
      <td><b>${row.actor || ''}</b></td>
      <td>${row.actor_role || ''}</td>
      <td><code>${row.ip || ''}</code></td>
      <td>${row.event || ''}</td>
      <td>${row.target || ''}</td>
    </tr>`).join('') || '<tr><td colspan=6 style="color:var(--sub);text-align:center;padding:26px">No entries.</td></tr>';
  document.getElementById('info').textContent = `${data.rows.length ? offset + 1 : 0}–${offset + data.rows.length} of ${total}`;
  document.getElementById('prev').disabled = offset === 0;
  document.getElementById('next').disabled = !data.has_more;
}

function showDetail(jsonStr) {
  const el = document.getElementById('detail');
  el.textContent = JSON.stringify(JSON.parse(jsonStr), null, 2);
  el.hidden = false;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

load(0);
</script>
