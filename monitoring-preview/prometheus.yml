global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ['kong:8100']

  # vLLM model servers. Targets live in vllm-targets.yml — add/remove machines
  # there and Prometheus picks them up automatically (no restart needed).
  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/vllm-targets.yml
        refresh_interval: 30s
