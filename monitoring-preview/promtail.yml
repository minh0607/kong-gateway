server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # All Docker containers (Kong proxy/5xx, Postgres, usermgmt, auth-proxy).
  # Reads container stdout/stderr through the Docker API.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Keep ONLY the Kong stack — the host runs many unrelated projects.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(kong|kong-database|kong-usermgmt|kong-auth-proxy)'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - target_label: job
        replacement: docker

  # Flask audit log (login failures, lockouts, admin actions) — JSON lines.
  - job_name: audit
    static_configs:
      - targets: [localhost]
        labels:
          job: audit
          __path__: /var/log/audit/audit-*.jsonl
    pipeline_stages:
      - json:
          expressions:
            event: event
            actor: actor
      - labels:
          event:
