# Local DEV-only preview stack: Prometheus + Grafana scraping Kong's Status API.
# NOT for production (production uses the existing Zabbix + Grafana via the
# zabbix/ template). Joins the running Kong network to scrape kong:8100 directly.
#
#   docker compose -f monitoring-preview/docker-compose.yml up -d
#   Grafana:    http://<dev-ip>:3000   (admin / admin)
#   Prometheus: http://<dev-ip>:9090

networks:
  kong_kong-net:
    external: true

volumes:
  grafana_data: {}
  prometheus_data: {}
  loki_data: {}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: kong-preview-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./vllm-targets.yml:/etc/prometheus/vllm-targets.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - kong_kong-net

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: kong-preview-renderer
    restart: unless-stopped
    environment:
      AUTH_TOKEN: "kong-render-token"
    networks:
      - kong_kong-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: kong-preview-mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"   # web UI to view captured alert emails
    networks:
      - kong_kong-net

  # DEV-only webhook receiver: echoes the alert JSON and returns 200 so the
  # webhook channel is demonstrable. On prod, point the webhook contact point at
  # your real internal endpoint (n8n, ticketing, ...) instead of this.
  webhook-sink:
    image: mendhak/http-https-echo:latest
    container_name: kong-preview-webhook-sink
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    networks:
      - kong_kong-net

  loki:
    image: grafana/loki:latest
    container_name: kong-preview-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - kong_kong-net

  promtail:
    image: grafana/promtail:3.5.1
    container_name: kong-preview-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../data/audit:/var/log/audit:ro
    networks:
      - kong_kong-net

  grafana:
    image: grafana/grafana:latest
    container_name: kong-preview-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - mailpit
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # SMTP -> mailpit (DEV demo). On prod, point at the internal SMTP relay.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "mailpit:1025"
      GF_SMTP_FROM_ADDRESS: "kong-grafana@sehc.local"
      GF_SMTP_FROM_NAME: "Kong Grafana"
      GF_SMTP_SKIP_VERIFY: "true"
      # Image rendering (export dashboards/panels to PNG/PDF via the renderer).
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_RENDERING_RENDERER_TOKEN: "kong-render-token"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - kong_kong-net
