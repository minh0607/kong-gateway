<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <style>
      .lbl{font-size:13px;fill:#111827;text-anchor:middle;font-weight:600;}
      .sub{font-size:10.5px;fill:#6b7280;text-anchor:middle;}
      .flow{stroke:#6b7280;stroke-width:1.9;fill:none;}
      .port{font-size:11px;fill:#0b6b64;text-anchor:middle;font-weight:700;}
      .pill{fill:#ecfdf5;stroke:#0f9d94;stroke-width:1;}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#f8fafc"/>
  <image href="data:image/png;base64," x="24" y="14" width="122" height="30" opacity="0.95"/>
  <text x="480" y="34" font-size="18" font-weight="700" fill="#0b6b64" text-anchor="middle">Monitoring data flow (ports)</text>

  <!-- sources -->
  <rect x="40" y="95" width="210" height="92" rx="8" fill="#e6f7f5" stroke="#0f9d94" stroke-width="1.8"/>
  <text class="lbl" x="145" y="122">Kong — Status API</text>
  <rect class="pill" x="95" y="132" width="100" height="20" rx="10"/>
  <text class="port" x="145" y="146">:8100/metrics</text>
  <text class="sub" x="145" y="172">Prometheus plugin (read-only)</text>

  <rect x="40" y="235" width="210" height="120" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="lbl" x="145" y="262">vLLM servers</text>
  <rect class="pill" x="95" y="272" width="100" height="20" rx="10"/>
  <text class="port" x="145" y="286">:8000/metrics</text>
  <text class="sub" x="145" y="308">prompt / generation _tokens_total</text>
  <text class="sub" x="145" y="326">(~10 machines · file_sd)</text>

  <!-- collectors -->
  <rect x="365" y="88" width="210" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.8"/>
  <text class="lbl" x="470" y="114">Zabbix</text>
  <text class="sub" x="470" y="133">HTTP-agent · Prometheus preproc.</text>
  <text class="sub" x="470" y="149">per-route LLD · triggers</text>
  <text class="port" x="470" y="169">pulls Kong :8100</text>

  <rect x="365" y="238" width="210" height="92" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lbl" x="470" y="264">Prometheus (preview)</text>
  <rect class="pill" x="425" y="274" width="90" height="20" rx="10" fill="#fef2f2" stroke="#ef4444"/>
  <text class="port" x="470" y="288" fill="#b91c1c">:9090</text>
  <text class="sub" x="470" y="312">file_sd_configs · vllm-targets.yml</text>

  <!-- visualize -->
  <rect x="680" y="150" width="230" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="lbl" x="795" y="180">Grafana</text>
  <rect class="pill" x="748" y="190" width="94" height="20" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="port" x="795" y="204" fill="#1d4ed8">:3000</text>
  <text class="sub" x="795" y="228">Zabbix datasource (prod)</text>
  <text class="sub" x="795" y="246">18-panel dashboard</text>
  <text class="sub" x="795" y="264">rate · errors · latency p95/p99</text>
  <text class="sub" x="795" y="282">consumption by route/consumer</text>
  <text class="sub" x="795" y="300">vLLM token usage · alerts</text>

  <!-- flows with port labels -->
  <path class="flow" d="M250,135 H365" marker-end="url(#arr)"/>
  <text class="sub" x="307" y="127" fill="#0b6b64">scrape :8100</text>
  <path class="flow" d="M250,285 H365" marker-end="url(#arr)"/>
  <text class="sub" x="307" y="277" fill="#0b6b64">scrape :8000</text>
  <path class="flow" d="M250,150 C300,150 300,270 365,278" marker-end="url(#arr)"/>
  <path class="flow" d="M575,130 C625,130 630,200 680,208" marker-end="url(#arr)"/>
  <path class="flow" d="M575,284 C625,284 630,250 680,244" marker-end="url(#arr)"/>

  <text x="480" y="410" font-size="11.5" fill="#374151" text-anchor="middle">Production path: Kong /metrics (:8100) → Zabbix → Grafana (:3000). Preview: Prometheus (:9090) + Loki (:3100) + Grafana + mailpit (:8026).</text>
  <text x="480" y="430" font-size="11" fill="#b91c1c" text-anchor="middle">Scrape the Status API :8100 — never the Admin API :8001. vLLM :8000 also serves the model API, so firewall it to the scraper IP.</text>
</svg>
