<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 480" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .h{font-size:13.5px;font-weight:700;fill:#0F172A;text-anchor:middle;}
      .s{font-size:10.5px;fill:#64748B;text-anchor:middle;}
      .flow{stroke:#94A3B8;stroke-width:2;fill:none;}
      .card{fill:#FFFFFF;stroke:#E6E9EF;stroke-width:1;}
      .pt{font-size:11px;font-weight:700;text-anchor:middle;}
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#F7F8FA"/>
  <image xlink:href="data:image/png;base64," x="26" y="20" width="120" height="30" opacity="0.95"/>
  <text x="500" y="42" font-size="19" font-weight="800" fill="#0F172A" text-anchor="middle">Monitoring data flow</text>

  <!-- column captions -->
  <text x="140" y="86" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">SOURCES</text>
  <text x="470" y="86" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">COLLECTORS</text>
  <text x="820" y="86" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="1">VISUALIZE</text>

  <!-- sources -->
  <rect class="card" x="40" y="104" width="200" height="96" rx="14"/>
  <text class="h" x="140" y="132">Kong · Status API</text>
  <rect x="88" y="144" width="104" height="20" rx="10" fill="#E9FBF8" stroke="#0F9D94"/>
  <text class="pt" x="140" y="158" fill="#0B7C74">:8100 /metrics</text>
  <text class="s" x="140" y="184">Prometheus plugin (read-only)</text>

  <rect x="40" y="228" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="h" x="140" y="256">vLLM servers</text>
  <rect x="88" y="268" width="104" height="20" rx="10" fill="#E9FBF8" stroke="#0F9D94"/>
  <text class="pt" x="140" y="282" fill="#0B7C74">:8000 /metrics</text>
  <text class="s" x="140" y="308">prompt / generation tokens</text>
  <text class="s" x="140" y="326">~10 machines · file_sd</text>

  <!-- collectors -->
  <rect class="card" x="368" y="104" width="204" height="96" rx="14"/>
  <text class="h" x="470" y="132">Zabbix</text>
  <text class="s" x="470" y="152">HTTP-agent · Prometheus preproc.</text>
  <text class="s" x="470" y="169">per-route LLD · triggers</text>
  <rect x="398" y="176" width="144" height="18" rx="9" fill="#FFF7ED" stroke="#F59E0B"/>
  <text class="pt" x="470" y="189" fill="#B45309">pulls Kong :8100</text>

  <rect class="card" x="368" y="252" width="204" height="96" rx="14"/>
  <text class="h" x="470" y="280">Prometheus (preview)</text>
  <rect x="430" y="290" width="80" height="20" rx="10" fill="#FEF2F2" stroke="#EF4444"/>
  <text class="pt" x="470" y="304" fill="#B91C1C">:9090</text>
  <text class="s" x="470" y="330">file_sd_configs · vllm-targets.yml</text>

  <!-- visualize -->
  <rect class="card" x="700" y="120" width="230" height="212" rx="16"/>
  <text class="h" x="815" y="150" font-size="15">Grafana</text>
  <rect x="768" y="160" width="94" height="20" rx="10" fill="#EFF6FF" stroke="#3B82F6"/>
  <text class="pt" x="815" y="174" fill="#1D4ED8">:3000</text>
  <line x1="724" y1="194" x2="906" y2="194" stroke="#EEF0F4"/>
  <text class="s" x="815" y="214">Zabbix datasource (prod)</text>
  <text class="s" x="815" y="234">18-panel dashboard</text>
  <text class="s" x="815" y="254">rate · errors · latency p95/p99</text>
  <text class="s" x="815" y="274">consumption by route / consumer</text>
  <text class="s" x="815" y="294">vLLM token usage · alerts</text>

  <!-- flows -->
  <path class="flow" d="M240,152 H366" marker-end="url(#ar)"/>
  <text class="pt" x="303" y="142" fill="#0B7C74">scrape :8100</text>
  <path class="flow" d="M240,288 H366" marker-end="url(#ar)"/>
  <text class="pt" x="303" y="278" fill="#0B7C74">scrape :8000</text>
  <path class="flow" d="M240,170 C300,170 300,296 366,300" marker-end="url(#ar)"/>
  <path class="flow" d="M572,150 C640,150 650,210 700,214" marker-end="url(#ar)"/>
  <path class="flow" d="M572,296 C640,296 650,250 700,246" marker-end="url(#ar)"/>

  <rect class="card" x="120" y="384" width="760" height="64" rx="12"/>
  <text x="500" y="410" font-size="11.5" fill="#334155" text-anchor="middle">Production: Kong /metrics (:8100) → Zabbix → Grafana (:3000). Preview: Prometheus (:9090) + Loki (:3100) + Grafana + mailpit (:8026).</text>
  <text x="500" y="432" font-size="11" fill="#B91C1C" text-anchor="middle">Scrape the Status API :8100 — never the Admin API :8001. vLLM :8000 also serves the model API → firewall it to the scraper IP.</text>
</svg>
