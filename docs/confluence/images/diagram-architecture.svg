<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 640" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .h{font-size:13.5px;font-weight:700;fill:#0F172A;text-anchor:middle;}
      .s{font-size:10.5px;fill:#64748B;text-anchor:middle;}
      .flow{stroke:#94A3B8;stroke-width:2;fill:none;}
      .card{fill:#FFFFFF;stroke:#E6E9EF;stroke-width:1;}
      .pill{fill:#E9FBF8;stroke:#0F9D94;stroke-width:1;}
      .pt{font-size:10.5px;font-weight:700;fill:#0B7C74;text-anchor:middle;}
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#F7F8FA"/>
  <image xlink:href="data:image/png;base64," x="26" y="20" width="120" height="30" opacity="0.95"/>
  <text x="500" y="42" font-size="19" font-weight="800" fill="#0F172A" text-anchor="middle">Architecture — Docker stack (Kong OSS 3.9)</text>

  <!-- clients -->
  <rect class="card" x="36" y="150" width="150" height="150" rx="14"/>
  <text class="h" x="111" y="176">Clients</text>
  <line x1="60" y1="188" x2="162" y2="188" stroke="#EEF0F4"/>
  <text class="s" x="111" y="210">Applications</text>
  <text class="s" x="111" y="230">n8n · Dify</text>
  <text class="s" x="111" y="250">Claude Code</text>
  <text class="s" x="111" y="270">internal apps</text>

  <!-- gateway host -->
  <rect x="226" y="90" width="484" height="474" rx="18" fill="#F4FBFA" stroke="#CDEBE7"/>
  <text x="468" y="118" font-size="12.5" font-weight="700" fill="#0B7C74" text-anchor="middle">Gateway host · network: kong-net</text>

  <!-- nginx -->
  <rect class="card" x="250" y="134" width="205" height="78" rx="12"/>
  <text class="h" x="352" y="160">kong-auth-proxy</text>
  <text class="s" x="352" y="178">nginx · session auth · RBAC</text>
  <rect class="pill" x="300" y="186" width="104" height="18" rx="9"/>
  <text class="pt" x="352" y="199">:8002 · /aigw</text>

  <!-- usermgmt -->
  <rect class="card" x="478" y="134" width="208" height="78" rx="12"/>
  <text class="h" x="582" y="160">kong-usermgmt</text>
  <text class="s" x="582" y="178">Flask · login / MFA / audit</text>
  <rect class="pill" x="548" y="186" width="68" height="18" rx="9"/>
  <text class="pt" x="582" y="199">:8888</text>

  <!-- kong core -->
  <rect x="250" y="230" width="436" height="150" rx="14" fill="#FFFFFF" stroke="#0F9D94" stroke-width="1.6"/>
  <text class="h" x="468" y="256" fill="#0B7C74">kong · proxy · admin · status</text>
  <rect class="card" x="268" y="272" width="128" height="58" rx="10"/>
  <text class="pt" x="332" y="294" font-size="11.5">Proxy</text>
  <text class="s" x="332" y="314">:8000 · :8443</text>
  <rect class="card" x="404" y="272" width="128" height="58" rx="10"/>
  <text class="pt" x="468" y="294" font-size="11.5">Admin API</text>
  <text class="s" x="468" y="314">:8001 · :8444</text>
  <rect class="card" x="540" y="272" width="128" height="58" rx="10"/>
  <text class="pt" x="604" y="294" font-size="11.5">Status /metrics</text>
  <text class="s" x="604" y="314">:8100</text>
  <text class="s" x="468" y="360">plugins: key-auth · acl · ip-restriction · rate-limiting · prometheus</text>

  <!-- postgres -->
  <rect class="card" x="330" y="404" width="276" height="66" rx="12"/>
  <text class="h" x="468" y="430">kong-database</text>
  <text class="s" x="468" y="450">PostgreSQL 15 · volume pg_data</text>
  <rect class="pill" x="614" y="426" width="60" height="18" rx="9" fill="#EFF6FF" stroke="#3B82F6"/>
  <text class="pt" x="644" y="439" fill="#1D4ED8">:5432</text>

  <!-- upstreams -->
  <rect x="742" y="150" width="220" height="290" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="h" x="852" y="178">External LLM servers</text>
  <text class="s" x="852" y="196">Docker on Ubuntu</text>
  <rect class="card" x="770" y="212" width="164" height="44" rx="10"/>
  <text class="s" x="852" y="239" font-size="11.5">vLLM box · :8000</text>
  <rect class="card" x="770" y="264" width="164" height="44" rx="10"/>
  <text class="s" x="852" y="291" font-size="11.5">vLLM box · :8000</text>
  <rect class="card" x="770" y="316" width="164" height="44" rx="10"/>
  <text class="s" x="852" y="343" font-size="11.5">Ollama · :11433</text>
  <text class="s" x="852" y="392">… ~10 machines</text>

  <!-- flows -->
  <path class="flow" d="M186,200 C210,200 214,168 248,168" marker-end="url(#ar)"/>
  <text class="pt" x="214" y="150">:8002</text>
  <path class="flow" d="M186,250 C210,250 220,300 248,300" marker-end="url(#ar)"/>
  <text class="pt" x="214" y="290">:8000/:8443</text>
  <path class="flow" d="M352,212 V230" marker-end="url(#ar)"/>
  <text class="pt" x="384" y="226">:8001</text>
  <path class="flow" d="M468,380 V404" marker-end="url(#ar)"/>
  <text class="pt" x="494" y="398">:5432</text>
  <path class="flow" d="M686,300 C712,300 720,300 742,300" marker-end="url(#ar)"/>
  <text class="pt" x="714" y="290">:8000</text>
</svg>
